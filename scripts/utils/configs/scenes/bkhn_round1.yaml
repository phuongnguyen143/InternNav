scene: bkhn_round1

# LiDAR point2plane odom is ROS body frame; camera projection needs body→optical.
odom_apply_body2optical: true

paths:
  bag: ${data_root}/raw_rosbag/bkhn_round1
  camera_odom: ${data_root}/raw_rosbag/bkhn_round1/odometry_bkhn_round1_point2plane.txt
  floor_trajectory: ${data_root}/raw_rosbag/bkhn_round1/floor_trajectory.txt
  output_dir: ${data_root}/process_keyframe/bkhn_round1
keyframe:
  sharp_turn_thresh_deg: 25.0
  curvature_thresh_deg: 25.0
  max_dist_between_keyframes: 3
  min_dist_between_keyframes: 1
  keyframes_per_episode: 12
  record_fps: 15